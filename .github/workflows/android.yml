name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android

    steps:
      # 检出仓库代码，供后续 Android 构建使用。
      - name: 检出代码
        uses: actions/checkout@v4

      # 配置 AGP 8.7 所需的 Temurin JDK 17。
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 配置 Gradle 缓存
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 安装 Android SDK 组件（compileSdk 35 / build-tools 35.0.0，防止 runner 预装版本缺失）
      - name: 安装 Android SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      # CI 环境切换到官方 Gradle 分发源（本地开发保留腾讯镜像，GitHub runner 访问官方更快更稳）
      - name: 切换官方 Gradle 分发源
        run: |
          sed -i "s|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip|" gradle/wrapper/gradle-wrapper.properties
          sed -i 's|networkTimeout=10000|networkTimeout=120000|' gradle/wrapper/gradle-wrapper.properties

      # 赋予 Wrapper 执行权限并构建 Debug APK。
      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 上传构建生成的 app-debug.apk，便于下载验收。
      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

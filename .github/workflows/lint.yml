name: Android Lint

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/lint.yml"

concurrency:
  group: android-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android

    steps:
      # 检出 Android 工程与 Gradle Wrapper。
      - name: 检出代码
        uses: actions/checkout@v4

      # Detekt 与 Android Gradle Plugin 均使用 Temurin JDK 17。
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 配置 Gradle 缓存
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 安装 Android SDK 组件（compileSdk 35 / build-tools 35.0.0，防止 runner 预装版本缺失）
      - name: 安装 Android SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      # CI 环境切换到官方源（本地开发保留镜像，GitHub runner 访问官方更快更稳）
      - name: 切换官方 Gradle 分发源与仓库
        run: |
          sed -i "s|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip|" gradle/wrapper/gradle-wrapper.properties
          sed -i 's|networkTimeout=10000|networkTimeout=120000|' gradle/wrapper/gradle-wrapper.properties
          sed -i '/maven.aliyun.com/s/^/\/\//' settings.gradle.kts

      # 执行 Android Kotlin 静态代码检查；iOS SwiftLint 已延后。
      - name: 运行 Detekt
        run: |
          chmod +x gradlew
          ./gradlew detekt
